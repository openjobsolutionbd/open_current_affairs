name: Update wiki index

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Verify site consistency
        run: python3 scripts/verify_site.py

      - name: পরিবর্তন আছে কিনা যাচাই
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/topics-index.json docs/mcq-index.json docs/sw.js docs/version.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/topic/ docs/sitemap.xml docs/robots.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # সত্যিকারের কনটেন্ট পরিবর্তন হলেই (changed==true) কেবল ভার্সন বাড়ানো হয় —
      # নাহলে প্রতিটা push-এই ভার্সন বাড়তে থাকত, আর এই ওয়ার্কফ্লোর নিজের
      # rebuild-PR merge-ও তো main-এ একটা push, ফলে অসীম লুপ তৈরি হতো।
      # যেহেতু "Build index" ধাপ আগেই পুরোনো VERSION দিয়ে চলেছে, তাই এই
      # diff-check নিজেই ভার্সন-নিরপেক্ষভাবে প্রকৃত কনটেন্ট পরিবর্তন ধরে —
      # merge-এর পরের রানে নতুন কিছু না পেলে changed=false হবে, লুপ থামবে।
      - name: ভার্সন বাড়ানো (শুধু প্রকৃত কনটেন্ট পরিবর্তন থাকলে)
        if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION
          echo "ভার্সন বাড়ানো হলো: $CURRENT → $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: নতুন ভার্সন দিয়ে আবার বিল্ড (sw.js/version.json স্ট্যাম্প করতে)
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/build_index.py

      - name: বাম্প হওয়া ফাইল আবার stage করা
        if: steps.changes.outputs.changed == 'true'
        run: git add VERSION docs/topics-index.json docs/mcq-index.json docs/sw.js docs/version.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/topic/ docs/sitemap.xml docs/robots.txt

      # branch protection চালু থাকায় bot সরাসরি main-এ push করতে পারে না,
      # তাই একটা নির্দিষ্ট auto/ branch-এ push করে PR খোলে/আপডেট করে —
      # scripts/pr_checks.py এই branch-কে generated-ফাইল guard থেকে exempt করে।
      #
      # গুরুত্বপূর্ণ: GITHUB_TOKEN দিয়ে করা push/PR-create কখনোই downstream
      # workflow (pr-check.yml) ট্রিগার করে না — এটা GitHub-এর ইচ্ছাকৃত
      # recursive-loop-প্রতিরোধ নিয়ম, branch নতুন না পুরনো তাতে কিছু যায়-আসে
      # না (পরীক্ষায় প্রমাণিত — "fresh branch" পদ্ধতিও কাজ করেনি, PR #37)।
      # তাই এখানে repo secret BOT_PAT (একটা সাধারণ personal access token)
      # ব্যবহার করা হয় — human-token-চালিত push/PR ইভেন্ট নির্ভরযোগ্যভাবে
      # check ট্রিগার করে, তাই আবার সরল force-push+reuse পদ্ধতিতে ফেরা গেছে।
      #
      # ⚠️ সতর্কতা (রুট-কজ, ২০২৬-০৮-২১-এ ধরা পড়েছে, PR #64 ৬ দিন আটকে ছিল):
      # commit message-এ "[skip ci]" (বা যেকোনো skip-ci ভ্যারিয়েন্ট) কখনো
      # যোগ করবেন না — এতে শুধু push-ট্রিগার্ড এই workflow না, একই commit-এর
      # pull_request (synchronize) ইভেন্টও স্কিপ হয়ে যায়, ফলে pr-check.yml
      # কখনো চলে না আর auto/rebuild-output PR চিরস্থায়ীভাবে
      # mergeable_state: blocked থেকে যায় (BOT_PAT-এর দোষ না, এটা GitHub-এর
      # নিজস্ব skip-ci আচরণ, যা push ও pull_request উভয় ইভেন্টেই প্রযোজ্য)।
      # recursion-guard-এর জন্য [skip ci] দরকারও নেই — নিচের diff-check
      # (changed==false পরের রানে) নিজেই infinite-loop ঠেকায়।
      - name: Rebuild branch push + PR তৈরি/আপডেট
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          BRANCH="auto/rebuild-output"
          git checkout -B "$BRANCH"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          if [ -n "$NEW_VERSION" ]; then
            git commit -m "chore: rebuild generated site output + bump version to $NEW_VERSION"
          else
            git commit -m "chore: rebuild generated site output"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH" --force

          EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            | python3 -c "import sys, json; prs = json.load(sys.stdin); match = [p['number'] for p in prs if p['head']['ref'] == 'auto/rebuild-output']; print(match[0] if match else '')")

          if [ -z "$EXISTING" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls" \
              -d '{"title":"chore: generated site output re-sync (auto)","head":"'"$BRANCH"'","base":"main","body":"main-এ push হওয়া সোর্স পরিবর্তনের সাথে generated output (topics-index.json, per-topic HTML, sitemap ইত্যাদি) sync করতে স্বয়ংক্রিয়ভাবে তৈরি হয়েছে। branch protection-এর কারণে bot সরাসরি main-এ push করতে পারে না, তাই এই PR — merge করার আগে চেক পাস করা নিশ্চিত করুন।"}'
          else
            echo "ইতিমধ্যে PR #$EXISTING খোলা আছে — নতুন commit push হয়ে গেছে (BOT_PAT দিয়ে, তাই synchronize check ঠিকমতো ট্রিগার হবে)।"
          fi
