name: Update wiki index

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN দিয়ে করা push/PR/API-কল কোনো workflow-কেই ট্রিগার করে
      # না (GitHub-এর ইচ্ছাকৃত loop-প্রতিরোধ নিয়ম, শুধু force-push/synchronize-এ
      # সীমাবদ্ধ না — PR "opened" ইভেন্টও এর আওতায় পড়ে, যা আগের অনুমান ভুল
      # প্রমাণ করেছে PR #40-এ zero check-run দেখে)। তাই checkout-এ একটা আলাদা
      # PAT ব্যবহার করা হচ্ছে যাতে নিচের সব push/PR/close/delete API-কল
      # সাধারণ ব্যবহারকারীর কাজ হিসেবে গণ্য হয় এবং pr-check.yml সত্যিই চলে।
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Verify site consistency
        run: python3 scripts/verify_site.py

      - name: পরিবর্তন আছে কিনা যাচাই
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/topics-index.json docs/mcq-index.json docs/sw.js docs/version.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/topic/ docs/sitemap.xml docs/robots.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # branch protection চালু থাকায় bot সরাসরি main-এ push করতে পারে না,
      # তাই একটা নির্দিষ্ট auto/ branch-এ push করে PR খোলে — scripts/pr_checks.py
      # এই branch-কে generated-ফাইল guard থেকে exempt করে।
      #
      # প্রতিবার আগের auto-PR/branch বন্ধ করে/মুছে ফেলে সম্পূর্ণ নতুন branch+PR
      # বানানো হয় (repo পরিষ্কার রাখতে, পুরনো bot-PR জমে থাকা এড়াতে)। আসল
      # fix হলো নিচের GH_TOKEN — এখন এটা GITHUB_TOKEN না, একটা PAT
      # (secrets.AUTOMATION_PAT) — কারণ GITHUB_TOKEN দিয়ে করা যেকোনো push/PR
      # (force-push, নতুন PR "opened" সহ সবকিছু) অন্য কোনো workflow-কে ট্রিগার
      # করে না, ফলে pr-check.yml কখনো চলত না এবং required check না পেয়ে PR
      # চিরতরে blocked থাকত।
      - name: Rebuild branch push + PR তৈরি
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          BRANCH="auto/rebuild-output"

          EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            | python3 -c "import sys, json; prs = json.load(sys.stdin); match = [p['number'] for p in prs if p['head']['ref'] == 'auto/rebuild-output']; print(match[0] if match else '')")

          if [ -n "$EXISTING" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$EXISTING" -d '{"state":"closed"}' > /dev/null
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING/comments" \
              -d '{"body":"নতুন rebuild এসেছে — এই branch fresh করে নতুন PR খোলা হচ্ছে (পুরনো branch-এ force-push status check re-trigger করে না)।"}' > /dev/null
          fi
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$BRANCH" > /dev/null

          git checkout -B "$BRANCH"
          git commit -m "chore: rebuild generated site output [skip ci]"
          git push origin "$BRANCH"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d '{"title":"chore: generated site output re-sync (auto)","head":"'"$BRANCH"'","base":"main","body":"main-এ push হওয়া সোর্স পরিবর্তনের সাথে generated output (topics-index.json, per-topic HTML, sitemap ইত্যাদি) sync করতে স্বয়ংক্রিয়ভাবে তৈরি হয়েছে। branch protection-এর কারণে bot সরাসরি main-এ push করতে পারে না, তাই এই PR — merge করার আগে চেক পাস করা নিশ্চিত করুন।"}'
